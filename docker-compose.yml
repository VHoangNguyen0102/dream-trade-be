version: '3.8'

networks:
  dream-trade-network:
    driver: bridge

volumes:
  redis-data:


services:
  # MongoDB on Cloud - No need for local container
  # Already using MongoDB Atlas: mongodb+srv://...
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - dream-trade-network
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== ONLY AUTH SERVICE ACTIVE ==========

