version: '3.8'

networks:
  dream-trade-network:
    driver: bridge

volumes:
  redis-data:
  ai-models:

services:
  # MongoDB on Cloud - No need for local container
  # Already using MongoDB Atlas: mongodb+srv://...
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - dream-trade-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== MARKET SERVICE ==========

  market-service:
    build:
      context: .
      dockerfile: Dockerfile.monorepo
      args:
        APP_NAME: market
    image: dream-trade/market-service:latest
    container_name: market-service
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run start:market
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dream-trade-network
    restart: unless-stopped

  # auth-service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.monorepo
      args:
        APP_NAME: auth
    image: dream-trade/auth-service:latest
    container_name: auth-service
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dream-trade-network
    restart: unless-stopped

  # subscription-service
  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile.monorepo
      args:
        APP_NAME: subscription
    image: dream-trade/subscription-service:latest
    container_name: subscription-service
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dream-trade-network
    restart: unless-stopped

  # crawler-service
  crawler-service:
    build:
      context: ./apps/crawler
      dockerfile: Dockerfile
    image: dream-trade/crawler-service:latest
    container_name: crawler-service
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE_CRAWLER}
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dream-trade-network
    restart: unless-stopped

  # ai-analysis-service (Python FastAPI)
  ai-analysis-service:
    build:
      context: ./apps/ai-analysis
      dockerfile: Dockerfile
    image: dream-trade/ai-analysis-service:latest
    container_name: ai-analysis-service
    ports:
      - '3003:3003'
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE_CRAWLER}
      REDIS_URL: redis://redis:6379
      MARKET_API_URL: http://market-service:3001/market
      USE_PRETRAINED: 'true'
      HOST: 0.0.0.0
      PORT: 3003
      LOG_LEVEL: INFO
    volumes:
      - ./apps/ai-analysis:/app
      - ai-models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      market-service:
        condition: service_started
    networks:
      - dream-trade-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # realtime-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.monorepo
  #     args:
  #       APP_NAME: realtime
  #   image: dream-trade/realtime-service:latest
  #   container_name: realtime-service
  #   ports:
  #     - "3004:3004"
  #   environment:
  #     PORT: 3004
  #     REDIS_URL: redis://redis:6379
  #     NODE_ENV: production
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - dream-trade-network
  #   restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.monorepo
      args:
        APP_NAME: gateway
    image: dream-trade/gateway:latest
    container_name: gateway
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      MARKET_SERVICE_URL: http://market-service:3001
      CRAWLER_SERVICE_URL: http://crawler-service:3002
      AI_SERVICE_URL: http://ai-analysis-service:3003
      AUTH_SERVICE_URL: http://auth-service:3005
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3006
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      # Mount source code for hot reload
      - ./apps:/app/apps
      - ./libs:/app/libs
      # Don't mount node_modules (use container's version)
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      market-service:
        condition: service_started
      auth-service:
        condition: service_started
      subscription-service:
        condition: service_started
    networks:
      - dream-trade-network
    restart: unless-stopped
